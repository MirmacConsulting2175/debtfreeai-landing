version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build

  artifacts:
    baseDirectory: .next
    files:
      - standalone/**/*
      - static/**/*
      - ../public/**/*

  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
      - .npm/**/*